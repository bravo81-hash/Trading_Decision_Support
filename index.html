<style>
:root{--bg:#090f1f;--panel:#111a2f;--line:#2a3958;--text:#eef4ff;--muted:#9fb0d0;--accent:#60a5fa;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,rgba(96,165,250,.2),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{padding:14px clamp(12px,2.5vw,28px);border-bottom:1px solid var(--line);background:rgba(9,15,31,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}h1{margin:0;font-size:clamp(1.15rem,2.3vw,1.75rem);letter-spacing:-.04em}.sub{color:var(--muted);margin-top:4px;font-size:.84rem}.app{padding:12px clamp(10px,2vw,22px) calc(110px + var(--safe));display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;align-items:start}.left{display:grid;gap:10px}.panel{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.24);overflow:hidden}.head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.body{padding:10px 12px}.toolbar{display:flex;flex-wrap:wrap;gap:7px}button{border:0;border-radius:11px;padding:8px 10px;font-weight:850;cursor:pointer;background:var(--accent);color:#06111f;font-size:.82rem}button.secondary{background:#233250;color:var(--text);border:1px solid var(--line)}button.danger{background:#7f1d1d;color:#fff}.note,.mini{color:var(--muted);font-size:.76rem;line-height:1.35}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#22304d;color:var(--muted);border:1px solid var(--line);font-size:.72rem;white-space:nowrap}.good{color:#bbf7d0;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.35)}.warn{color:#fde68a;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}.bad{color:#fecaca;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.38)}label{display:block;font-size:.7rem;color:#cbd5e1;margin-bottom:4px;font-weight:750}input{width:100%;padding:8px 9px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:#0d1427;color:var(--text);font:inherit;font-size:.82rem}.tradeBar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:thin}.tradeBtn{min-width:132px;text-align:left;background:#0d1427;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:9px;display:grid;gap:2px}.tradeBtn.active{outline:2px solid var(--accent);background:#122242}.tradeMeta{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.advancedGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.hidden{display:none}.tileWrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tileGroup{border:1px solid rgba(255,255,255,.07);background:rgba(13,20,39,.45);border-radius:15px;padding:9px}.groupTitle{font-weight:900;letter-spacing:-.02em;margin-bottom:7px;font-size:.86rem;display:flex;justify-content:space-between;gap:8px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{border:1px solid var(--line);background:#0d1427;color:var(--text);border-radius:12px;min-height:50px;padding:7px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;justify-content:center}.tile.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,165,250,.18);background:#14284b}.tile b{font-size:.76rem;line-height:1.08}.tile span{font-size:.64rem;color:var(--muted);line-height:1.14}.tile.badish.active{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.16)}.tile.warnish.active{border-color:var(--warn);box-shadow:0 0 0 2px rgba(245,158,11,.14)}.rec{position:sticky;top:86px;max-height:calc(100vh - 98px);display:flex;flex-direction:column}.rec .body{overflow:auto}.hero{background:linear-gradient(135deg,rgba(96,165,250,.14),rgba(34,197,94,.08)),#0d1427;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}.hero h2{margin:6px 0 5px;font-size:clamp(1.15rem,2vw,1.75rem);letter-spacing:-.04em}.why{color:#cbd5e1;line-height:1.35;font-size:.84rem}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}.metric{background:#0d1427;border:1px solid var(--line);border-radius:13px;padding:9px}.metric span{font-size:.68rem;color:var(--muted)}.metric b{display:block;font-size:.92rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choiceLine{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.rankGrid{display:grid;gap:8px}.adj{border:1px solid var(--line);background:#0d1427;border-radius:14px;padding:10px}.adjTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.adj strong{font-size:.86rem}.bar{height:7px;background:#24304b;border-radius:999px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}.warnBox,.badBox{border-radius:12px;padding:8px;margin-top:7px;font-size:.74rem;line-height:1.3}.warnBox{border:1px solid rgba(245,158,11,.32);background:rgba(245,158,11,.08);color:#fde68a}.badBox{border:1px solid rgba(239,68,68,.32);background:rgba(239,68,68,.08);color:#fecaca}.logicBox{border:1px solid rgba(96,165,250,.28);background:rgba(96,165,250,.07);border-radius:14px;padding:10px;margin:10px 0}.logicBox b{display:block;margin-bottom:4px}.matrixGrid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}.matrixItem{border:1px solid rgba(255,255,255,.1);background:#0d1427;border-radius:12px;padding:8px}.matrixItem strong{font-size:.78rem}.matrixItem div{font-size:.7rem;color:var(--muted);line-height:1.3;margin-top:3px}.mobileRec{display:none}@media(max-width:1120px){.app{grid-template-columns:1fr}.rec{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;max-height:48vh;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0}.rec.collapsed .body{display:none}.rec.collapsed{max-height:none}.rec .head{cursor:pointer}.tileWrap{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}header .sub{display:none}.mobileRec{display:inline-flex}}@media(max-width:560px){header{padding:10px}.app{padding:8px 8px calc(104px + var(--safe));gap:8px}.head,.body{padding:9px 10px}.tradeBar{padding:8px 10px}.tradeBtn{min-width:118px;padding:8px}.editRow{grid-template-columns:1fr}.advancedGrid{grid-template-columns:1fr 1fr}.tileGroup{padding:8px}.tiles{grid-template-columns:repeat(2,1fr);gap:5px}.tile{min-height:46px;padding:7px}.tile b{font-size:.74rem}.tile span{display:none}.hero{padding:11px}.hero h2{font-size:1.22rem}.rec .body{padding-bottom:calc(10px + var(--safe))}}

<body>
<header><h1>Options Adjustment Tile Triage</h1><div class="sub">Fast last-hour decision support. Tap tiles; recommendation stays visible and updates immediately.</div></header>
<main class="app">
<div class="left">
<section class="panel"><div class="head"><div><strong>Trades</strong><div class="note">Swipe horizontally, select one, then tap context tiles.</div></div><div class="toolbar"><button id="addTrade">Add</button><button class="secondary" id="examples">Examples</button><button class="secondary" id="toggleAdvanced">Exact</button></div></div><div id="tradeList" class="tradeBar"></div><div class="body"><div class="editRow"><div><label>Selected trade name</label><input id="tradeName" placeholder="e.g. SPY Cal" /></div><div class="toolbar"><button id="saveTrade">Save</button><button class="danger" id="deleteTrade">Delete</button></div></div><div id="advanced" class="advancedGrid hidden"><div><label>Exact Δ/lot</label><input id="exactDelta" type="number" step="0.5" placeholder="optional"></div><div><label>Exact P/L %</label><input id="exactPl" type="number" step="0.5" placeholder="optional"></div><div><label>Exact DTE</label><input id="exactDte" type="number" step="1" placeholder="optional"></div></div></div></section>
<section class="panel"><div class="head"><div><strong>Tap context tiles</strong><div class="note">Every tap updates the recommendation.</div></div><span class="pill">Fast mode</span></div><div class="body"><div id="tiles" class="tileWrap"></div></div></section>
</div>
<section class="panel rec" id="recPanel"><div class="head" id="recHead"><strong>Recommendation</strong><span id="confidence" class="pill">Ready</span><span class="pill mobileRec">tap to collapse</span></div><div class="body" id="output"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const groups=[
{key:'ticker',title:'Ticker',items:[['SPY','SPY','ETF'],['QQQ','QQQ','ETF'],['SPX','SPX','index'],['RUT','RUT','index'],['ES','ES','futures']]},
{key:'strategy',title:'Strategy',items:[['atm_calendar','ATM','cal/diag'],['dual_calendar','Dual','cal/diag'],['calendar_bfly','Cal+Fly','BWB'],['rut_pcs_calendar','RUT PCS','+ put cal'],['triple_calendar','Triple','cal/diag'],['put_bwb','Put BWB','OTM']]},
{key:'delta',title:'Delta state',items:[['pos_urgent','+Urgent','> +8/lot','badish'],['pos_adjust','+Adjust','+5 to +8','warnish'],['pos_mild','+Mild','+3 to +5'],['balanced','Balanced','±3'],['neg_mild','-Mild','-3 to -5'],['neg_adjust','-Adjust','-5 to -8','warnish'],['neg_urgent','-Urgent','< -8/lot','badish']]},
{key:'move',title:'Move today',items:[['regime_down','Regime↓','breakdown','badish'],['large_down','Large↓','ATR move','badish'],['mod_down','Mod↓','pullback','warnish'],['small_down','Small↓','noise'],['flat','Flat','range'],['small_up','Small↑','bounce'],['mod_up','Mod↑','rally','warnish'],['large_up','Large↑','ATR move','badish'],['regime_up','Regime↑','breakout','badish']]},
{key:'zone',title:'Price zone',items:[['centered','Centered','ideal'],['near_lower','Lower tent','near'],['near_upper','Upper tent','near'],['below_be','Below BE','risk','badish'],['above_be','Above BE','risk','badish'],['near_pcs','PCS put','danger','badish']]},
{key:'next',title:'Likely next',items:[['stabilise','Chop','stabilise'],['slow_drift_down','Drift↓','target'],['slow_drift_up','Drift↑','target'],['continue_down','Cont↓','defence','badish'],['continue_up','Cont↑','defence','badish'],['snapback','Snapback','risk','warnish']]},
{key:'repair',title:'Repair needed',items:[['delta_fast','Fast Δ','debit spread'],['theta_tent','Theta/tent','cal/diag'],['vega_reduce','Vega↓','credit spread'],['target_zone','Target','fly/BWB'],['simplify','Simplify','reduce/roll'],['profit_take','Profit','scale/exit']]},
{key:'greekPair',title:'Greek pair',items:[['delta_theta','Δ + Θ','tent/theta repair'],['delta_vega','Δ + Vega','defence/vol repair'],['theta_vega','Θ + Vega','efficiency repair']]},
{key:'pl',title:'P/L',items:[['target','Target','hit','good'],['normal','Normal','inside plan'],['defensive','-12%','defensive','warnish'],['hard_loss','-20%','hard loss','badish']]},
{key:'dte',title:'DTE',items:[['healthy','15-45','healthy'],['low','8-10','low','warnish'],['very_low','≤7','very low','badish']]},
{key:'regime',title:'Regime / IV',items:[['range_stable','Range','IV stable'],['trend_iv_ok','Trend','IV ok'],['iv_high','IV high','rising','warnish'],['event','Event','risk','warnish'],['regime','Regime','change','badish']]},
{key:'constraints',title:'Rules',items:[['ok','OK','adjust'],['outside','Outside','plan only','warnish'],['adjusted','Adjusted','today','warnish'],['complex','Complex','simplify','warnish'],['no_add','No add','reduce','badish']]}
];
const defaults={name:'SPY Cal',ticker:'SPY',strategy:'atm_calendar',delta:'balanced',move:'small_down',zone:'centered',next:'stabilise',repair:'theta_tent',greekPair:'delta_theta',pl:'normal',dte:'healthy',regime:'range_stable',constraints:'ok',exactDelta:'',exactPl:'',exactDte:''};
const universe={hold:'Do nothing / monitor',partial:'Partial exit / scale out',exit:'Full exit',simplify:'Simplify / remove stale leg',putCal:'Add put calendar',putDiag:'Add put diagonal',putDebit:'Add put debit spread',callCredit:'Add call credit spread',putBwb:'Add lower put butterfly/BWB',rollLower:'Roll / re-center lower',callCal:'Add call calendar',callDiag:'Add call diagonal',callDebit:'Add call debit spread',putCredit:'Add put credit spread',callBwb:'Add upper call butterfly/BWB',rollHigher:'Roll / re-center higher',reducePcs:'Reduce PCS risk'};
let trades=[],active=0;function uid(){return Math.random().toString(36).slice(2,9)}function selected(){return trades[active]||null}function labelFor(k,v){let g=groups.find(x=>x.key===k),it=g?.items.find(x=>x[0]===v);return it?it[1]:v}
function renderTiles(){let t=selected();$('tradeName').value=t?.name||'';$('exactDelta').value=t?.exactDelta||'';$('exactPl').value=t?.exactPl||'';$('exactDte').value=t?.exactDte||'';$('tiles').innerHTML=groups.map(g=>`<div class="tileGroup"><div class="groupTitle"><span>${g.title}</span><span class="pill">${labelFor(g.key,t?.[g.key])}</span></div><div class="tiles">${g.items.map(it=>`<button class="tile ${it[3]||''} ${t&&t[g.key]===it[0]?'active':''}" data-group="${g.key}" data-val="${it[0]}"><b>${it[1]}</b><span>${it[2]}</span></button>`).join('')}</div></div>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{selected()[b.dataset.group]=b.dataset.val;renderAll()})}
function renderTrades(){$('tradeList').innerHTML=trades.map((t,i)=>`<button class="tradeBtn ${i===active?'active':''}" data-i="${i}"><strong>${t.name}</strong><span class="tradeMeta">${t.ticker} • ${labelFor('strategy',t.strategy)} • ${labelFor('delta',bucketed(t).delta)}</span></button>`).join('');document.querySelectorAll('.tradeBtn').forEach(b=>b.onclick=()=>{active=+b.dataset.i;renderAll()})}
function bucketed(t){let v={...t};if(v.exactDelta!==''){let x=parseFloat(v.exactDelta);if(!Number.isNaN(x))v.delta=x>=8?'pos_urgent':x>=5?'pos_adjust':x>=3?'pos_mild':x<=-8?'neg_urgent':x<=-5?'neg_adjust':x<=-3?'neg_mild':'balanced'}if(v.exactPl!==''){let p=parseFloat(v.exactPl);if(!Number.isNaN(p))v.pl=p>=8?'target':p<=-20?'hard_loss':p<=-12?'defensive':'normal'}if(v.exactDte!==''){let d=parseFloat(v.exactDte);if(!Number.isNaN(d))v.dte=d<=7?'very_low':d<=10?'low':'healthy'}return v}
function base(){let s={};Object.keys(universe).forEach(k=>s[k]={k,label:universe[k],score:50,why:[],watch:[]});return s}function add(s,k,p,w,t){s[k].score+=p;if(w)s[k].why.push(w);if(t)s[k].watch.push(t)}function many(s,ks,p,w,t){ks.forEach(k=>add(s,k,p,w,t))}function riskAdding(){return ['putCal','putDiag','putBwb','callCal','callDiag','callBwb','putCredit','callCredit']}function dirDown(m){return ['small_down','mod_down','large_down','regime_down'].includes(m)}function dirUp(m){return ['small_up','mod_up','large_up','regime_up'].includes(m)}function severe(m){return ['large_down','large_up','regime_down','regime_up'].includes(m)}function isRegime(v){return v.move.includes('regime')||v.regime==='regime'}
function score(raw){let v=bucketed(raw),s=base(),warnings=[];add(s,'hold',4,'Baseline: avoid unnecessary adjustment.');add(s,'partial',3,'Scaling is always available risk reduction.');
if(v.constraints==='outside'){warnings.push('Outside final-hour rule: plan only, do not execute.');many(s,riskAdding(),-30,null,'outside execution window');add(s,'hold',28,'Execution window guardrail.')}if(v.constraints==='adjusted'){warnings.push('Already adjusted today: no second adjustment unless emergency risk reduction.');many(s,riskAdding(),-32,null,'one-adjustment/day rule');add(s,'hold',26,'One-adjustment/day guardrail.');add(s,'partial',10,'Risk reduction still allowed.')}if(v.constraints==='no_add'){warnings.push('No additional risk allowed.');many(s,riskAdding(),-28,null,'no-add-risk constraint');add(s,'partial',18,'No-add-risk constraint.');add(s,'simplify',18,'No-add-risk constraint.')}if(v.constraints==='complex'){warnings.push('Trade already complex; new structures penalised.');many(s,riskAdding(),-18,null,'complexity penalty');add(s,'simplify',26,'Complexity already high.');add(s,'partial',14,'Reduce complexity.')}if(v.pl==='target'||v.repair==='profit_take'){warnings.push('Profit/protect-profit mode: scale or exit outranks adjustment.');add(s,'partial',42,'Profit/protect-profit mode.');add(s,'exit',30,'Profit/protect-profit mode.');many(s,riskAdding(),-25,null,'profit already available')}if(v.pl==='defensive'){warnings.push('Defensive P/L zone: avoid adding unless directly hedging.');add(s,'partial',24,'Defensive P/L zone.');add(s,'exit',12,'Defensive P/L zone.');many(s,['putCal','putDiag','callCal','callDiag','putBwb','callBwb'],-14,null,'drawdown complexity penalty')}if(v.pl==='hard_loss'){warnings.push('Hard-loss zone: exit/scale/simplify first.');add(s,'exit',46,'Hard-loss zone.');add(s,'partial',36,'Hard-loss zone.');add(s,'simplify',24,'Hard-loss zone.');many(s,riskAdding(),-42,null,'hard-loss guardrail')}if(v.dte==='low'){warnings.push('Low DTE: prefer roll/reduce/simplify.');add(s,'simplify',14,'Low DTE.');many(s,['putCal','putDiag','callCal','callDiag','putBwb','callBwb'],-12,null,'low DTE')}if(v.dte==='very_low'){warnings.push('Very low DTE: avoid fresh complex structures.');add(s,'partial',24,'Very low DTE.');add(s,'exit',14,'Very low DTE.');add(s,'simplify',22,'Very low DTE.');many(s,['putCal','putDiag','callCal','callDiag','putBwb','callBwb'],-25,null,'very low DTE')}if(isRegime(v)){warnings.push('Regime-change context: risk reduction over theta collection.');add(s,'partial',30,'Regime-change context.');add(s,'exit',20,'Regime-change context.');many(s,['putCal','putDiag','callCal','callDiag'],-18,null,'regime-change penalty')}if(v.regime==='iv_high'){warnings.push('IV high/rising: calendars need term-structure check.');add(s,'putDebit',8,'High/rising IV can favour cleaner debit hedge over new long-vega tent.');add(s,'callDebit',8,'High/rising IV can favour cleaner debit hedge over new long-vega tent.');add(s,'callCredit',8,'High IV supports short premium if rebound risk is acceptable.');add(s,'putCredit',8,'High IV supports short premium if pullback risk is acceptable.');many(s,['putCal','callCal'],-6,null,'IV already high')}
if(v.delta==='balanced'){add(s,'hold',26,'Delta balanced.');if(v.zone==='centered')add(s,'hold',18,'Price centered.')}if(v.delta.startsWith('pos')){add(s,'putCal',v.delta.includes('urgent')?24:v.delta.includes('adjust')?20:10,'Positive delta: put calendar repairs by adding downside theta/tent.');add(s,'putDiag',v.delta.includes('urgent')?23:v.delta.includes('adjust')?19:9,'Positive delta: put diagonal adds more directional slope than calendar.');add(s,'putDebit',v.delta.includes('urgent')?30:v.delta.includes('adjust')?23:10,'Positive delta: put debit spread gives fastest downside hedge.');add(s,'putBwb',v.delta.includes('urgent')?17:13,'Positive delta: lower fly/BWB works if you have a downside target zone.');add(s,'rollLower',v.delta.includes('urgent')?22:18,'Positive delta: rolling lower re-centers the existing tent.');add(s,'callCredit',v.delta.includes('urgent')?13:11,'Positive delta: call credit spread adds negative delta, theta, and lower vega.');many(s,['callCal','callDiag','callDebit','putCredit','rollHigher'],-14,null,'wrong-direction for positive delta')}if(v.delta.startsWith('neg')){add(s,'callCal',v.delta.includes('urgent')?24:v.delta.includes('adjust')?20:10,'Negative delta: call calendar repairs by adding upside theta/tent.');add(s,'callDiag',v.delta.includes('urgent')?23:v.delta.includes('adjust')?19:9,'Negative delta: call diagonal adds more directional slope than calendar.');add(s,'callDebit',v.delta.includes('urgent')?30:v.delta.includes('adjust')?23:10,'Negative delta: call debit spread gives fastest upside hedge.');add(s,'callBwb',v.delta.includes('urgent')?17:13,'Negative delta: upper fly/BWB works if you have an upside target zone.');add(s,'rollHigher',v.delta.includes('urgent')?22:18,'Negative delta: rolling higher re-centers the existing tent.');add(s,'putCredit',v.delta.includes('urgent')?13:11,'Negative delta: put credit spread adds positive delta, theta, and lower vega.');many(s,['putCal','putDiag','putDebit','callCredit','rollLower'],-14,null,'wrong-direction for negative delta')}
if(v.repair==='delta_fast'){add(s,'putDebit',v.delta.startsWith('pos')?26:-8,'Fast delta repair favours debit spreads.');add(s,'callDebit',v.delta.startsWith('neg')?26:-8,'Fast delta repair favours debit spreads.');many(s,['putCal','callCal','putBwb','callBwb'],-8,null,'fast hedge preferred over tent shaping')}if(v.repair==='theta_tent'){add(s,'putCal',v.delta.startsWith('pos')?20:0,'Theta + tent repair favours calendars.');add(s,'putDiag',v.delta.startsWith('pos')?18:0,'Theta + directional slope favours diagonals.');add(s,'callCal',v.delta.startsWith('neg')?20:0,'Theta + tent repair favours calendars.');add(s,'callDiag',v.delta.startsWith('neg')?18:0,'Theta + directional slope favours diagonals.');many(s,['putDebit','callDebit'],-6,null,'theta repair preferred over hard hedge')}if(v.repair==='vega_reduce'){add(s,'callCredit',v.delta.startsWith('pos')?24:0,'Vega reduction + bearish delta favours call credit spread.');add(s,'putCredit',v.delta.startsWith('neg')?24:0,'Vega reduction + bullish delta favours put credit spread.');many(s,['putCal','callCal'],-14,null,'vega reduction conflicts with new calendars')}if(v.repair==='target_zone'){add(s,'putBwb',v.delta.startsWith('pos')?24:0,'Defined downside target favours lower fly/BWB.');add(s,'callBwb',v.delta.startsWith('neg')?24:0,'Defined upside target favours upper fly/BWB.');many(s,['putDebit','callDebit'],-5,null,'target-zone repair preferred over blunt hedge')}if(v.repair==='simplify'){add(s,'simplify',32,'Simplification selected as primary repair.');add(s,'partial',22,'Simplification selected as primary repair.');many(s,riskAdding(),-18,null,'simplification preferred over adding legs')}
if(v.greekPair==='delta_theta'){if(v.delta.startsWith('pos')){add(s,'putCal',16,'Δ+Θ logic: repair tent/theta while reducing bullish delta.');add(s,'putDiag',15,'Δ+Θ logic: diagonal gives theta plus directional slope.');add(s,'rollLower',10,'Δ+Θ logic: re-center existing tent before adding complexity.')}if(v.delta.startsWith('neg')){add(s,'callCal',16,'Δ+Θ logic: repair tent/theta while reducing bearish delta.');add(s,'callDiag',15,'Δ+Θ logic: diagonal gives theta plus directional slope.');add(s,'rollHigher',10,'Δ+Θ logic: re-center existing tent before adding complexity.')}many(s,['putDebit','callDebit'],-5,null,'Δ+Θ repair prefers theta/tent over blunt hedge unless danger is high')}

function greekLogic(v){if(v.greekPair==='delta_theta')return{title:'Δ + Θ repair rule',text:'Fix directional drift while restoring theta/tent. Prefer calendars, diagonals or rolls when the move is manageable; use debit spreads only when the move becomes dangerous.',matrix:[['Moderate + chop','calendar / diagonal / roll'],['Slow drift','diagonal or BWB'],['Danger move','debit spread or scale first']]};if(v.greekPair==='delta_vega')return{title:'Δ + Vega repair rule',text:'Stabilise direction first, then reduce excess vega. Debit spreads fit continuation risk; credit spreads fit elevated IV when the move is likely stabilising. Fresh calendars are penalised.',matrix:[['Continuation risk','debit spread'],['Exhaustion + high IV','credit spread'],['Regime change','scale / exit / simplify']]};return{title:'Θ + Vega repair rule',text:'If delta is acceptable, improve efficiency rather than direction. Prefer credit spreads, BWBs/flies, stale-leg removal, or simplification.',matrix:[['Delta balanced','credit spread / BWB / simplify'],['Target zone clear','fly / BWB'],['Too complex','remove stale leg / scale']]}}
function renderOutput(){let t=selected();if(!t)return;let r=score(t),top=r.ranked[0],alts=r.ranked.slice(1,5),cls=top.score>=78?'good':top.score>=62?'warn':'bad',logic=greekLogic(r.v);$('confidence').className='pill '+cls;$('confidence').textContent=(top.score>=78?'High':top.score>=62?'Medium':'Low')+' • '+top.score;let chips=['ticker','strategy','delta','move','zone','next','repair','greekPair'].map(k=>`<span class="pill">${labelFor(k,r.v[k])}</span>`).join('');let warnHtml=r.warnings.slice(0,2).map(w=>`<div class="${w.includes('PCS')||w.includes('Hard')?'badBox':'warnBox'}">${w}</div>`).join('');$('output').innerHTML=`<div class="summary"><div class="metric"><span>Trade</span><b>${t.name}</b></div><div class="metric"><span>Repair</span><b>${labelFor('repair',r.v.repair)}</b></div></div><div class="hero"><span class="pill ${cls}">${top.score}/100 primary</span><h2>${top.label}</h2><div class="why">${top.why.slice(0,2).join(' ')}</div><div class="choiceLine">${chips}</div>${warnHtml}</div><div class="logicBox"><b>${logic.title}</b><div class="mini">${logic.text}</div><div class="matrixGrid">${logic.matrix.map(m=>`<div class="matrixItem"><strong>${m[0]}</strong><div>${m[1]}</div></div>`).join('')}</div></div><div class="rankGrid">${alts.map(a=>`<div class="adj"><div class="adjTop"><strong>${a.label}</strong><span class="pill">${a.score}</span></div><div class="mini">${a.why.slice(0,1).join(' ')}</div><div class="bar"><span style="width:${a.score}%"></span></div></div>`).join('')}</div>`}
